name: Cron de manutenção

on:
  schedule:
    - cron: "0 * * * *" # a cada hora
  workflow_dispatch: # permite rodar manualmente

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os secrets APP_URL e CRON_SECRET no repositório."
            exit 1
          fi
          http_code=$(curl -s -o /tmp/cron_out.json -w "%{http_code}" "$APP_URL/api/cron?token=$CRON_SECRET")
          cat /tmp/cron_out.json
          if [ "$http_code" != "200" ]; then
            echo "Cron falhou com HTTP $http_code"
            exit 1
          fi
